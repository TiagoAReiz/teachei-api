spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false

  # Disable Cosmos DB for tests
  autoconfigure:
    exclude:
      - com.azure.spring.data.cosmos.core.CosmosTemplate

# Disable Cosmos DB
azure:
  cosmos:
    uri: https://localhost:8081
    key: test-key
    database: test
    populate-query-metrics: false

# JWT Configuration
jwt:
  secret: test-secret-key-for-testing-purposes-minimum-32-characters
  expiration-hours: 1

# Mercado Pago Configuration (mock values for tests)
mercadopago:
  access-token: TEST-token
  public-key: TEST-public-key
  webhook-secret: test-secret

# FIPE API
fipe:
  base-url: https://parallelum.com.br/fipe/api/v1

# App URLs
app:
  base-url: http://localhost:8080
  frontend-url: http://localhost:3000

# Payment
payment:
  price-per-ad: 29.90
