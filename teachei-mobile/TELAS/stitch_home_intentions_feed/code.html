<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Findable - Login</title>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#137fec",
                        "primary-dark": "#0c62b8",
                        "background-light": "#ffffff",
                        "background-dark": "#101922",
                        "surface-light": "#f3f4f6",
                        "surface-dark": "#1e2936",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings:
            'FILL' 1,
            'wght' 400,
            'GRAD' 0,
            'opsz' 24
        }
        /* Custom scrollbar for clean look */
        ::-webkit-scrollbar {
            width: 0px;
            background: transparent;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-slate-50 dark:bg-black font-display antialiased text-slate-900 dark:text-white selection:bg-primary selection:text-white">
<!-- Mobile Container Wrapper -->
<div class="mx-auto max-w-[480px] min-h-screen bg-background-light dark:bg-background-dark relative overflow-hidden shadow-2xl flex flex-col">
<!-- Header Image / Brand Area -->
<div class="relative w-full h-[240px]">
<!-- Gradient Overlay for better text readability if we had text over image, but here just for style -->
<div class="absolute inset-0 bg-gradient-to-b from-transparent to-background-light dark:to-background-dark z-10"></div>
<div class="w-full h-full bg-center bg-cover bg-no-repeat" data-alt="Abstract sleek automotive design close up" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuCKsdnCrwGSUnW3fuTWkbblGdxIrOiXYKxtoxGd82G62Fz2rS_8I1xusVeiKxTDmQCs10xVh-h4ix5TNV4adDtpIbCjsnQbkYqCrCXOJ9AJlajaoCjXDIt8tlDqUtF0CfsElvnazy7QONfcqW9zsIAy__hUycqwqPTmlf7YsCJlRVNLZBUxm034Qt0uhDpEnMc6b4cVo20sOORMXpgAvc0xQ3ih-OJtfV3rlNkjJO0FRfp6yD7Ug2tCrvGpmztgheiDxaQETMAyARo');">
</div>
<!-- Logo Floating -->
<div class="absolute bottom-4 left-0 right-0 z-20 flex justify-center">
<div class="bg-background-light/90 dark:bg-background-dark/90 backdrop-blur-sm px-6 py-2 rounded-full shadow-sm border border-slate-100 dark:border-slate-800">
<div class="flex items-center gap-2 text-primary font-extrabold text-xl tracking-tight">
<span class="material-symbols-outlined text-[24px]">directions_car</span>
                        FINDABLE
                    </div>
</div>
</div>
</div>
<!-- Scrollable Content -->
<div class="flex-1 flex flex-col px-6 pb-8 z-20">
<!-- Headlines -->
<div class="text-center mt-2 mb-8">
<h1 class="text-[28px] font-bold leading-tight text-slate-900 dark:text-white mb-2">
                    Welcome to Findable
                </h1>
<p class="text-slate-500 dark:text-slate-400 text-base font-medium leading-relaxed">
                    The easiest way to find your next vehicle.
                </p>
</div>
<!-- Social Stack -->
<div class="flex flex-col gap-3">
<!-- Apple Button -->
<button class="group relative flex w-full items-center justify-center gap-3 overflow-hidden rounded-full bg-black dark:bg-white text-white dark:text-black h-[52px] px-6 transition-transform active:scale-[0.98]">
<svg class="h-5 w-5 fill-current" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M17.886 16.96c-.445.65-1.026 1.3-1.688 1.3-.615 0-1.077-.375-1.923-.375-.898 0-1.282.35-1.923.35-.693 0-1.36-.675-1.846-1.4-1.9-2.775-1.257-6.05 1.127-7.2 1.052-.525 1.95-.075 2.513-.075.64 0 1.512-.5 2.512-.5.975 0 1.744.5 2.257.85-2.026 1.25-1.693 4.2.371 5.075-.128.4-.23.675-.397 1.025l-.003-.05zm-3.05-9.6c.435-.55.77-1.25.77-1.95 0-.1.025-.2.025-.3-1.077 0-2.282.8-2.923 1.55-.385.45-.718 1.175-.718 1.9 0 .075-.025.175-.025.275 1.103.1 2.333-.7 2.872-1.475z"></path></svg>
<span class="text-base font-bold tracking-wide">Continue with Apple</span>
</button>
<!-- Google Button -->
<button class="group relative flex w-full items-center justify-center gap-3 overflow-hidden rounded-full bg-surface-light dark:bg-surface-dark border border-slate-200 dark:border-slate-700 text-slate-900 dark:text-white h-[52px] px-6 transition-transform active:scale-[0.98]">
<svg class="h-5 w-5" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.84z" fill="#FBBC05"></path><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path></svg>
<span class="text-base font-bold tracking-wide">Continue with Google</span>
</button>
</div>
<!-- Divider -->
<div class="relative py-8 flex items-center">
<div class="flex-grow border-t border-slate-200 dark:border-slate-800"></div>
<span class="flex-shrink-0 mx-4 text-slate-400 dark:text-slate-500 text-sm font-medium">Or continue with email</span>
<div class="flex-grow border-t border-slate-200 dark:border-slate-800"></div>
</div>
<!-- Email Form -->
<form class="flex flex-col gap-4" onsubmit="event.preventDefault()">
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-slate-400 group-focus-within:text-primary transition-colors">mail</span>
</div>
<input class="w-full bg-surface-light dark:bg-surface-dark border-0 ring-1 ring-slate-200 dark:ring-slate-700 text-slate-900 dark:text-white placeholder:text-slate-400 rounded-full h-[52px] pl-12 pr-4 focus:ring-2 focus:ring-primary focus:bg-white dark:focus:bg-slate-900 transition-all text-base" placeholder="Email Address" type="email"/>
</div>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-slate-400 group-focus-within:text-primary transition-colors">lock</span>
</div>
<input class="w-full bg-surface-light dark:bg-surface-dark border-0 ring-1 ring-slate-200 dark:ring-slate-700 text-slate-900 dark:text-white placeholder:text-slate-400 rounded-full h-[52px] pl-12 pr-12 focus:ring-2 focus:ring-primary focus:bg-white dark:focus:bg-slate-900 transition-all text-base" placeholder="Password" type="password"/>
<button class="absolute inset-y-0 right-0 pr-4 flex items-center cursor-pointer text-slate-400 hover:text-slate-600 dark:hover:text-slate-200" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
<div class="flex justify-end pt-1">
<a class="text-sm font-semibold text-primary hover:text-primary-dark transition-colors" href="#">Forgot Password?</a>
</div>
<button class="w-full bg-primary hover:bg-primary-dark text-white font-bold h-[56px] rounded-full shadow-lg shadow-primary/30 active:shadow-none active:scale-[0.98] transition-all flex items-center justify-center gap-2 mt-2">
<span>Log In</span>
<span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</form>
<!-- Footer Links -->
<div class="mt-8 text-center">
<p class="text-slate-500 dark:text-slate-400 text-sm">
                    Don't have an account? 
                    <a class="text-primary font-bold hover:underline ml-1" href="#">Sign up</a>
</p>
</div>
</div>
</div>
<!-- 
        POST LOGIN MOCKUP SECTION 
        Included below for demonstration purposes as requested by "Persona Selection (Step 2)" 
    -->
<div class="mx-auto max-w-[480px] mt-12 mb-12 border-t-2 border-dashed border-slate-300 dark:border-slate-700 pt-8">
<h3 class="text-center text-slate-400 text-sm uppercase tracking-widest font-bold mb-4">Step 2: Role Selection Modal Mockup</h3>
<!-- Mockup Container -->
<div class="relative w-full h-[600px] bg-background-light dark:bg-background-dark shadow-2xl overflow-hidden rounded-3xl border border-slate-200 dark:border-slate-800">
<!-- Blurred Background (Simulating the login screen behind) -->
<div class="absolute inset-0 bg-slate-100 dark:bg-slate-900 opacity-50 blur-sm"></div>
<!-- Bottom Sheet Modal -->
<div class="absolute inset-x-0 bottom-0 bg-white dark:bg-[#15202b] rounded-t-[32px] shadow-[0_-10px_40px_rgba(0,0,0,0.1)] p-6 z-50 flex flex-col h-auto animate-in slide-in-from-bottom duration-500">
<!-- Drag Handle -->
<div class="w-12 h-1.5 bg-slate-200 dark:bg-slate-700 rounded-full mx-auto mb-6"></div>
<h2 class="text-xl font-bold text-slate-900 dark:text-white text-center mb-2">How will you use Findable?</h2>
<p class="text-slate-500 text-center text-sm mb-6 px-4">This helps us personalize your experience.</p>
<div class="space-y-4">
<!-- Option 1: Buyer -->
<label class="cursor-pointer group block">
<input class="peer sr-only" name="role" type="radio"/>
<div class="relative flex items-center p-4 rounded-2xl border-2 border-slate-100 dark:border-slate-800 bg-slate-50 dark:bg-slate-900/50 hover:bg-slate-100 dark:hover:bg-slate-800 transition-all peer-checked:border-primary peer-checked:bg-primary/5">
<div class="h-12 w-12 rounded-full bg-blue-100 dark:bg-blue-900/30 text-primary flex items-center justify-center mr-4 flex-shrink-0">
<span class="material-symbols-outlined">shopping_bag</span>
</div>
<div class="flex-1">
<h3 class="font-bold text-slate-900 dark:text-white">Occasional Buyer</h3>
<p class="text-xs text-slate-500 mt-1">I'm looking for a personal vehicle.</p>
</div>
<div class="h-6 w-6 rounded-full border-2 border-slate-300 dark:border-slate-600 peer-checked:border-primary peer-checked:bg-primary flex items-center justify-center transition-colors">
<span class="material-symbols-outlined text-white text-[16px] opacity-0 peer-checked:opacity-100">check</span>
</div>
</div>
</label>
<!-- Option 2: Seller -->
<label class="cursor-pointer group block">
<input class="peer sr-only" name="role" type="radio"/>
<div class="relative flex items-center p-4 rounded-2xl border-2 border-slate-100 dark:border-slate-800 bg-slate-50 dark:bg-slate-900/50 hover:bg-slate-100 dark:hover:bg-slate-800 transition-all peer-checked:border-primary peer-checked:bg-primary/5">
<div class="h-12 w-12 rounded-full bg-purple-100 dark:bg-purple-900/30 text-purple-600 dark:text-purple-400 flex items-center justify-center mr-4 flex-shrink-0">
<span class="material-symbols-outlined">storefront</span>
</div>
<div class="flex-1">
<h3 class="font-bold text-slate-900 dark:text-white">Shopkeeper / Reseller</h3>
<p class="text-xs text-slate-500 mt-1">I buy and sell vehicles professionally.</p>
</div>
<div class="h-6 w-6 rounded-full border-2 border-slate-300 dark:border-slate-600 peer-checked:border-primary peer-checked:bg-primary flex items-center justify-center transition-colors">
<span class="material-symbols-outlined text-white text-[16px] opacity-0 peer-checked:opacity-100">check</span>
</div>
</div>
</label>
</div>
<button class="w-full bg-primary hover:bg-primary-dark text-white font-bold h-[52px] rounded-full mt-6 shadow-lg shadow-primary/20">
                    Continue
                </button>
</div>
</div>
</div>
</body></html>
