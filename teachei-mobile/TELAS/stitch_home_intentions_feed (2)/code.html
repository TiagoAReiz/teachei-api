<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Create Ad - Category Step</title>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#137fec",
                        "background-light": "#f6f7f8",
                        "background-dark": "#101922",
                    },
                    fontFamily: {
                        "display": ["Plus Jakarta Sans", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "1rem", "lg": "2rem", "xl": "3rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display text-slate-900 dark:text-white overflow-x-hidden min-h-screen flex flex-col">
<!-- Top App Bar -->
<header class="flex items-center justify-between px-4 pt-6 pb-2 sticky top-0 z-10 bg-background-light/95 dark:bg-background-dark/95 backdrop-blur-sm">
<button aria-label="Go back" class="flex items-center justify-center p-2 rounded-full hover:bg-slate-200 dark:hover:bg-slate-800 transition-colors">
<span class="material-symbols-outlined text-slate-900 dark:text-white" style="font-size: 24px;">arrow_back</span>
</button>
<h2 class="text-lg font-bold leading-tight tracking-tight text-center flex-1 pr-10">Create Ad</h2>
<!-- Spacer div to balance the back button visually if needed, though 'pr-10' handles centering decently -->
<!-- <div class="w-10"></div> -->
</header>
<!-- Page Indicators (Stepper) -->
<div class="flex flex-col items-center w-full pt-4 pb-6">
<div class="flex w-full flex-row items-center justify-center gap-3">
<div class="h-2.5 w-8 rounded-full bg-primary transition-all duration-300"></div>
<div class="h-2.5 w-2.5 rounded-full bg-slate-300 dark:bg-slate-700"></div>
<div class="h-2.5 w-2.5 rounded-full bg-slate-300 dark:bg-slate-700"></div>
<div class="h-2.5 w-2.5 rounded-full bg-slate-300 dark:bg-slate-700"></div>
</div>
<p class="text-xs text-slate-500 dark:text-slate-400 mt-2 font-medium">Step 1 of 4</p>
</div>
<!-- Main Content Area -->
<main class="flex-1 flex flex-col px-4 pb-8 max-w-md mx-auto w-full">
<!-- Headline Text -->
<div class="text-center mb-8">
<h1 class="text-[28px] font-extrabold leading-tight text-slate-900 dark:text-white mb-2">
                What are you looking for?
            </h1>
<p class="text-base font-normal text-slate-500 dark:text-slate-400">
                Select the type of vehicle you want to buy.
            </p>
</div>
<!-- Category Cards List -->
<div class="flex flex-col gap-4">
<!-- Car Card -->
<button class="group relative flex items-center p-4 bg-white dark:bg-slate-800 rounded-[2rem] shadow-sm hover:shadow-md border-2 border-transparent hover:border-primary/20 active:border-primary active:scale-[0.98] transition-all duration-200 w-full text-left">
<div class="flex items-center justify-center size-14 rounded-full bg-blue-50 dark:bg-blue-900/30 text-primary shrink-0 group-hover:bg-primary group-hover:text-white transition-colors duration-200">
<span class="material-symbols-outlined" style="font-size: 28px;">directions_car</span>
</div>
<div class="ml-4 flex-1">
<h3 class="text-lg font-bold text-slate-900 dark:text-white group-hover:text-primary transition-colors">Carro</h3>
<p class="text-sm text-slate-500 dark:text-slate-400">Sedans, SUVs, Hatchbacks</p>
</div>
<div class="flex items-center justify-center size-8 rounded-full bg-slate-100 dark:bg-slate-700 text-slate-400 group-hover:bg-primary/10 group-hover:text-primary transition-colors">
<span class="material-symbols-outlined" style="font-size: 20px;">chevron_right</span>
</div>
</button>
<!-- Motorcycle Card -->
<button class="group relative flex items-center p-4 bg-white dark:bg-slate-800 rounded-[2rem] shadow-sm hover:shadow-md border-2 border-transparent hover:border-primary/20 active:border-primary active:scale-[0.98] transition-all duration-200 w-full text-left">
<div class="flex items-center justify-center size-14 rounded-full bg-blue-50 dark:bg-blue-900/30 text-primary shrink-0 group-hover:bg-primary group-hover:text-white transition-colors duration-200">
<span class="material-symbols-outlined" style="font-size: 28px;">two_wheeler</span>
</div>
<div class="ml-4 flex-1">
<h3 class="text-lg font-bold text-slate-900 dark:text-white group-hover:text-primary transition-colors">Moto</h3>
<p class="text-sm text-slate-500 dark:text-slate-400">Street, Sport, Scooter</p>
</div>
<div class="flex items-center justify-center size-8 rounded-full bg-slate-100 dark:bg-slate-700 text-slate-400 group-hover:bg-primary/10 group-hover:text-primary transition-colors">
<span class="material-symbols-outlined" style="font-size: 20px;">chevron_right</span>
</div>
</button>
<!-- Truck Card -->
<button class="group relative flex items-center p-4 bg-white dark:bg-slate-800 rounded-[2rem] shadow-sm hover:shadow-md border-2 border-transparent hover:border-primary/20 active:border-primary active:scale-[0.98] transition-all duration-200 w-full text-left">
<div class="flex items-center justify-center size-14 rounded-full bg-blue-50 dark:bg-blue-900/30 text-primary shrink-0 group-hover:bg-primary group-hover:text-white transition-colors duration-200">
<span class="material-symbols-outlined" style="font-size: 28px;">local_shipping</span>
</div>
<div class="ml-4 flex-1">
<h3 class="text-lg font-bold text-slate-900 dark:text-white group-hover:text-primary transition-colors">Caminhão</h3>
<p class="text-sm text-slate-500 dark:text-slate-400">Heavy duty, Commercial</p>
</div>
<div class="flex items-center justify-center size-8 rounded-full bg-slate-100 dark:bg-slate-700 text-slate-400 group-hover:bg-primary/10 group-hover:text-primary transition-colors">
<span class="material-symbols-outlined" style="font-size: 20px;">chevron_right</span>
</div>
</button>
</div>
</main>
<!-- Decorative Bottom Element (Optional, keeps design grounded) -->
<div class="mt-auto pb-6 pt-4 flex justify-center">
<!-- This area could house legal text or simply be spacing on mobile -->
<p class="text-xs text-slate-400 dark:text-slate-600">Secure &amp; Safe Transaction</p>
</div>
</body></html>
